$('un').onclick=()=>{if(act())del(G.stack.length-1)};
$('cl').onclick=()=>{if(act()&&G.stack.length){G.stack=[];snd(200,.15,'square',.08,.5);rP()}};
$('dv').onclick=()=>deliver();
$('pz').onclick=()=>{if(!act())return;G.paused=true;ov(`<h2>Pausado</h2><button class="bt" onclick="cov();G.paused=false">${ic('play',18,1)}Continuar</button><button class="bt g" onclick="cov();showM()">${ic('home',18)}Sair do nível</button>`)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)$('pz').click()});
const urg=()=>G.cust.slice().sort((a,b)=>a.pat/a.max-b.pat/b.max)[0];
function deliver(){if(!act()||!G.stack.length)return;const s=G.stack.join(),m=G.cust.filter(x=>x.order.join()==s);
const c=m.find(x=>x.id==G.sel)||m.sort((a,b)=>a.pat-b.pat)[0];
if(c){G.combo++;G.best=Math.max(G.best,G.combo);G.served++;if(!G.dirty)G.perf++;G.dirty=false;
const base=4+c.order.length*3,tip=Math.round(base*.5*c.y.tm*c.pat/c.max),comboBonus=1+Math.min(G.combo-1,5)*(.1+(MODE==='normal'?(S.up.k||0)*.05:0)),mn=Math.round((base+tip)*comboBonus*c.y.pay*(1+S.up.g*.1));
G.money+=mn;G.score+=mn*10;ghost(c,1);G.cust=G.cust.filter(x=>x!==c);G.stack=[];G.cd=.8;if(G.sel==c.id||!G.cust.some(x=>x.id==G.sel))G.sel=G.cust.length?urg().id:null;
jingle([523,659,784,1046]);vib([20,30,20]);pop('+R$ '+mn+(G.combo>1?' x'+G.combo:''));
G.ob.forEach(o=>{if(!o.d&&(o.k=='c'&&G.best>=o.v||o.k=='p'&&G.perf>=o.v)){o.d=1;setTimeout(()=>{pop('Objetivo cumprido!');jingle([784,1046])},600)}});
rC();rP();hud();if(G.served>=cfg.goal)setTimeout(()=>end(true),700)}
else{const sel=G.cust.find(x=>x.id==G.sel);G.combo=0;G.dirty=true;const penalty=MODE==='normal'?Math.max(0,5-(S.up.a||0)):5;G.money=Math.max(0,G.money-penalty);if(sel)sel.pat=Math.max(1,sel.pat-sel.max*.12*sel.y.wp*(1-(MODE==='normal'?(S.up.a||0)*.08:0)));
const so=[...G.stack].sort().join(),ord=G.cust.some(x=>[...x.order].sort().join()==so);
snd(160,.3,'sawtooth',.14,.5);vib(80);$('pl').classList.add('shake');setTimeout(()=>$('pl').classList.remove('shake'),400);
pop(ord?`Ordem errada! −R$ ${MODE==='normal'?Math.max(0,5-(S.up.a||0)):5}`:`Não confere! −R$ ${MODE==='normal'?Math.max(0,5-(S.up.a||0)):5}`);hud()}}
function end(p){if(!G.running)return;G.running=false;const ob=OB(G.n).map(o=>({...o,ok:o.k=='c'?G.best>=o.v:o.k=='p'?G.perf>=o.v:o.k=='t'?G.t>=o.v:G.lost<=o.v}));
let rw=0,tb=0,st=0;if(p){const dn=ob.filter(o=>o.ok).length;rw=dn*(10+G.n*4);tb=Math.floor(G.t/2);st=1+Math.min(2,dn)}
const tot=G.money+rw+tb;S.money+=tot;if((S.st[G.n]||0)<st)S.st[G.n]=st;if(p&&S.unl<=G.n&&G.n<18)S.unl=G.n+1;S.best[G.n]=Math.max(S.best[G.n]||0,G.score);save();
const nx=G.n<18?Object.keys(ING).filter(k=>ING[k].u==G.n+1):[];
if(p){jingle([523,659,784,1046,1318]);
ov(`<h2 style="color:var(--ok)">Nível ${G.n} concluído!</h2>${MODE==='hard'?'<p><small>Modo difícil · chapa dominada!</small></p>':''}<div class="stars">${[1,2,3].map(i=>`<span class="${i<=st?'f':''}" style="animation-delay:${i*.25}s">${ic('star',44,1)}</span>`).join('')}</div>
<div class="grid"><div><b>${G.served}/${cfg.goal}</b><small>Pedidos</small></div><div><b>${G.lost}</b><small>Perdidos</small></div><div><b>x${G.best}</b><small>Melhor combo</small></div><div><b>${G.score}</b><small>Pontos</small></div></div>
${ob.map(o=>`<div class="obj ${o.ok?'y':'n'}">${ic(o.ok?'check':'x',16)}${o.t}<span>${o.ok?'+R$ '+(10+G.n*4):'—'}</span></div>`).join('')}${tb?`<div class="obj y">${ic('timer',16)}Bônus de tempo<span>+R$ ${tb}</span></div>`:''}
<div class="gain">${ic('coin',28)}+R$ ${tot}</div>${nx.length?`<p><small>Próximo nível libera:</small> ${nx.map(k=>ik(k,24)).join(' ')}</p>`:''}
${G.n<18?`<button class="bt" onclick="intro(${G.n+1})">${ic('play',18,1)}Próximo nível</button>`:'<p><b>Você zerou o jogo!</b></p>'}<button class="bt g" onclick="intro(${G.n})">${ic('retry',18)}Jogar de novo</button><button class="bt g" onclick="cov();showM()">${ic('home',18)}Menu</button>`)}
else{jingle([392,330,262]);const tip=G.lost>=3?'Atenda primeiro o cliente com menos paciência.':'Siga as cores: verde certo, vermelho errado. Toque na camada para trocar.';
ov(`<div style="display:grid;place-items:center">${face({sk:1,hr:0,t:'n'},3,84)}</div><h2 style="color:var(--bad)">Tempo esgotado</h2><p>Você serviu <b>${G.served}</b> de <b>${cfg.goal}</b> pedidos.</p><div class="grid"><div><b>${G.lost}</b><small>Clientes perdidos</small></div><div><b>x${G.best}</b><small>Melhor combo</small></div></div><p><small>${tip}</small></p><div class="gain">${ic('coin',26)}+R$ ${tot}</div><button class="bt" onclick="intro(${G.n})">${ic('retry',18)}Tentar de novo</button><button class="bt g" onclick="cov();showM()">${ic('home',18)}Menu e melhorias</button>`,'lose')}}
setInterval(()=>{const n=performance.now(),dt=Math.min((n-last)/1000,.25);last=n;if(!act())return;
G.t-=dt;G.cust.forEach(c=>c.pat-=dt);if(MODE==='hard'&&G.grill.some(Boolean)){G.grill.forEach(x=>{if(x)x.p=Math.min(100,x.p+dt/x.time*100)});uG()}
const gone=G.cust.filter(c=>c.pat<=0);
if(gone.length){gone.forEach(c=>ghost(c,0));G.cust=G.cust.filter(c=>c.pat>0);G.lost+=gone.length;G.combo=0;snd(220,.3,'sawtooth',.12,.6);pop('Cliente foi embora!');if(!G.cust.some(x=>x.id==G.sel))G.sel=G.cust.length?urg().id:null;rC();rP()}
G.cd-=dt;if(G.cust.length<cfg.slots&&G.t>6&&G.cd<=0){spawn();G.cd=1.5*(1-(MODE==='hard'?(S.up.s||0):0)*.08)}
G.cust.forEach(c=>{const r=c.pat/c.max,m=r>.55?0:r>.3?1:r>.15?2:3,u=$('p'+c.id);if(u){u.style.width=Math.max(0,r*100)+'%';u.className=r<.3?'lo':''}
if(m!==c.mood){c.mood=m;const a=document.querySelector(`.cu[data-id="${c.id}"]`);if(a){a.dataset.m=m;a.querySelector('.av').innerHTML=face(c,m)}}});
hud();if(G.t<=0)end(false)},100);
showM();
</script></body></html>
